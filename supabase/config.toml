# Only what this project changes from Supabase defaults. `supabase config push`
# leaves undeclared settings untouched on the hosted project.
project_id = "central-3c"

[auth]
enabled = true
site_url = "https://central3c-caua.vercel.app"
additional_redirect_urls = [
  "https://central3c-caua.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
]
# Cadastro fechado: a conta do dono é criada pelo `npm run db:seed`.
enable_signup = false

[auth.email]
enable_signup = false
otp_length = 6
otp_expiry = 3600

# Custom templates need a custom SMTP provider on the Free plan. To use the
# template with the 6-digit code, configure [auth.email.smtp] and uncomment:
# [auth.email.template.magic_link]
# subject = "Seu acesso à Central 3C"
# content_path = "./supabase/templates/magic-link.html"
