# Only what this project changes from Supabase defaults. `supabase config push`
# leaves undeclared settings untouched on the hosted project.
project_id = "central-3c"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Seu acesso à Central 3C"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Seu acesso à Central 3C"
content_path = "./supabase/templates/magic-link.html"
