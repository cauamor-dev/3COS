<div style="background:#07060b;padding:32px 16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#ededf2">
  <div style="max-width:420px;margin:0 auto;background:#121019;border:1px solid #2a2440;border-radius:16px;padding:28px">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c4b5fd">Central 3C</p>
    <h1 style="margin:0 0 16px;font-size:20px">Entrar no painel</h1>
    <p style="margin:0 0 20px;color:#a8a6b5;font-size:14px;line-height:1.5">Clique no botão neste mesmo navegador ou digite o código no app.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600">Entrar</a>
    <p style="margin:24px 0 6px;color:#a8a6b5;font-size:13px">Código de acesso:</p>
    <p style="margin:0;font-family:ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:.3em;color:#fff">{{ .Token }}</p>
    <p style="margin:24px 0 0;color:#6f6c80;font-size:12px">Vale por 1 hora. Se não foi você, ignore este e-mail.</p>
  </div>
</div>
